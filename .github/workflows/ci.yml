name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.3 --locked --features cli

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Install pnpm
        run: npm install --global pnpm@10.34.9

      - name: Install just
        run: cargo install just --version 1.59.0 --locked

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.150 --locked

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI
        run: just ci
