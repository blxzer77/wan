[workspace]
members = [
    "crates/wan-types",
    "crates/wan-sandbox",
    "crates/wan-vault",
    "crates/wan-host",
    "crates/wan-core",
    "crates/wan-acp",
    "crates/wan-pages",
    "crates/wand",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["wan contributors"]

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "http2", "json"] }
secrecy = { version = "=0.10.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
wan-types = { path = "crates/wan-types", version = "0.1.0" }
wan-sandbox = { path = "crates/wan-sandbox", version = "0.1.0" }
wan-vault = { path = "crates/wan-vault", version = "0.1.0" }
wan-host = { path = "crates/wan-host", version = "0.1.0" }
wan-core = { path = "crates/wan-core", version = "0.1.0" }
wan-acp = { path = "crates/wan-acp", version = "0.1.0" }
wan-pages = { path = "crates/wan-pages", version = "0.1.0" }
