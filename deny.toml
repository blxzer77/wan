[graph]
all-features = true

[advisories]
# Only "unmaintained" advisories may be ignored here. A vulnerability advisory must never be
# ignored: upgrade, replace the dependency, or remove the code path instead.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (merged into zbus 6). Pulled in by keyring 4.2 through its Linux secret-service backend, which depends on zbus 5. Remove when keyring's Linux backend moves to zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (merged into zbus 6). Pulled in by keyring 4.2 through its Linux secret-service backend, which depends on zbus 5. Remove when keyring's Linux backend moves to zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (merged into zbus 6). Pulled in by keyring 4.2 through its Linux secret-service backend, which depends on zbus 5. Remove when keyring's Linux backend moves to zbus 6." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
